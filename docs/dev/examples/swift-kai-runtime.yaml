apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime
metadata:
  name: swift-kai
  labels:
    trainer.kubeflow.org/framework: torch
spec:
  mlPolicy:
    numNodes: 1
    torch:
      numProcPerNode: auto
  template:
    spec:
      replicatedJobs:
        - groupName: default
          name: node
          replicas: 1
          template:
            metadata:
              labels:
                kai.scheduler/queue: default-queue
                trainer.kubeflow.org/trainjob-ancestor-step: trainer
            spec:
              template:
                spec:
                  schedulerName: kai-scheduler
                  containers:
                    - name: node
                      image: ghcr.io/kubeflow/kubeflow/notebook-servers/jupyter-swift:v1.0.2
                      resources:
                        limits:
                          nvidia.com/gpu: "8"
                      workingDir: /home/jovyan
